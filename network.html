<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <title>Let's Connect | Eman and Associates P.C.</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
    <style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#1a2638; --navy-deep:#0f1923; --navy-line:#2c3c52;
  --sage:#6b9e85; --sage-light:#7db495;
  --cream:#faf8f5; --white:#fff;
  --text-primary:#1a2638; --text-secondary:#5a6672; --text-light:#8a939c;
  --mist:#a3b0be; --border:#e4e0db;
}
html{font-size:16px}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--cream);color:var(--text-primary);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:900px;margin:0 auto;padding:0 clamp(1rem,4vw,2.5rem)}
.nav{background:var(--navy);border-bottom:1px solid var(--navy-line)}
.nav__in{display:flex;align-items:center;height:68px}
.brand{font-size:.8rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#fff;line-height:1.3}
.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(104deg,transparent 46%,rgba(255,255,255,.03) 47%,rgba(255,255,255,.03) 55%,transparent 56%),
  radial-gradient(120% 80% at 8% 0%,rgba(107,158,133,.18),transparent 62%)}
.hero__in{position:relative;z-index:2;padding-top:clamp(2.4rem,5vw,3.6rem);padding-bottom:clamp(4rem,7vw,5.5rem)}
.hero h1{font-size:clamp(2.2rem,4.4vw,3.4rem);font-weight:800;line-height:1.02;letter-spacing:-.032em;margin-bottom:1rem}
.hero h1 .ac{color:var(--sage-light)}
.hero p{font-family:'Newsreader',Georgia,serif;font-size:1.08rem;line-height:1.65;color:var(--mist);max-width:34rem}
main{flex:1;padding-bottom:clamp(2.5rem,5vw,4rem)}
.calwrap{background:var(--white);border:1px solid var(--border);border-radius:3px;overflow:hidden;
  box-shadow:0 22px 50px -26px rgba(26,38,56,.28);margin-top:-2.5rem;position:relative;z-index:5}
.calwrap iframe{display:block;width:100%;border:none;overflow:hidden;min-height:760px}
.foot{background:var(--navy);color:#6e7c90;font-size:.77rem;padding:1.4rem 0}
    </style>
</head>
<body>
<nav class="nav">
  <div class="wrap nav__in">
    <a href="/" class="brand">Eman &amp;<br>Associates</a>
  </div>
</nav>

<header class="hero">
  <div class="wrap hero__in">
    <h1>Let's grab<br><span class="ac">some time.</span></h1>
    <p>Pick a slot that works for you and we will connect.</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="calwrap">
      <iframe src="https://app.emanlegal.com/widget/booking/oGFHQpxThZq3xNi7j0i5" allow="payment" style="width: 100%;border:none;overflow: hidden;" scrolling="no" id="oGFHQpxThZq3xNi7j0i5_1791571205948" title="Book a time"></iframe>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="wrap">© 2026 Eman and Associates P.C.</div>
</footer>

<script src="https://app.emanlegal.com/js/form_embed.js" type="text/javascript"></script>
</body>
</html>
